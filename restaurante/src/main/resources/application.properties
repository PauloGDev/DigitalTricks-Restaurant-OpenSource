spring.application.name=digitaltricks

# ==============================
# AMBIENTE
# ==============================
server.port=${SERVER_PORT:8080}

# ==============================
# DATABASE (DEV - H2)
# ==============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==============================
# SEGURANA / JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==============================
# MERCADO PAGO
# ==============================
mp.accessToken=${MP_ACCESS_TOKEN}

# ==============================
# CLOUDINARY
# ==============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==============================
# EMAIL
# ==============================
spring.mail.host=smtp.hostinger.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ==============================
# WHATSAPP
# ==============================
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN}
# ==============================
# CORS
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==============================
# LOGS
# ==============================
logging.level.org.springframework.security=INFO

# ==============================
# ENCODING
# ==============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
